<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prorate Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  font-size: 12.6px;
  margin: 0;
  padding: 10.8px;
  background-color: #f5f5f5;
}

.container {
  max-width: 450px;
  margin: 0 auto;
  background-color: #fff;
  padding: 14.4px;
  border-radius: 7.2px;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
}

h2 {
  text-align: center;
  font-size: 16.2px;
}

label {
  display: block;
  margin-top: 9px;
}

.bold-underline {
  font-weight: bold;
  text-decoration: underline;
  font-size: 13.5px;
}

input[type="number"],
input[type="date"],
select {
  width: 100%;
  padding: 7.2px;
  margin-top: 3.6px;
  font-size: 12.6px;
  border: 1px solid #ccc;
  border-radius: 3.6px;
  box-sizing: border-box;
}
input[type="date"] {
  background-color: #eeeeee;
  color: #222222;
}


button {
  width: 100%;
  padding: 9px;
  margin-top: 14.4px;
  background-color: #007BFF;
  color: white;
  border: none;
  border-radius: 3.6px;
  font-size: 12.6px;
  cursor: pointer;
}

button:hover {
  background-color: #0056b3;
}

.result {
  margin-top: 14.4px;
  padding: 9px;
  border: 1px solid #ccc;
  background: #f9f9f9;
  font-size: 12.6px;
  border-radius: 3.6px;
}

/* MOBILE FIX FOR DROPDOWN */
@media (max-width: 600px) {
  #billingDay {
    background-color: #ffffff !important;
    color: #000;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='20' viewBox='0 0 20 20' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M5 7l5 5 5-5H5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    padding-right: 30px;
  }
}
</style>
</head>
<body>

<div class="container">
  <h2>Prorate Calculator</h2>

  <label>
    <span class="bold-underline">Draft Date:</span>
    <select id="billingDay" onchange="setBillingDates()">
      <option value="1" selected>1st</option>
      <option value="2">2nd</option>
      <option value="3">3rd</option>
      <option value="4">4th</option>
      <option value="5">5th</option>
      <option value="6">6th</option>
      <option value="7">7th</option>
      <option value="8">8th</option>
      <option value="9">9th</option>
      <option value="10">10th</option>
      <option value="11">11th</option>
      <option value="12">12th</option>
      <option value="13">13th</option>
      <option value="14">14th</option>
      <option value="15">15th</option>
      <option value="16">16th</option>
      <option value="17">17th</option>
      <option value="18">18th</option>
      <option value="19">19th</option>
      <option value="20">20th</option>
      <option value="21">21st</option>
      <option value="22">22nd</option>
      <option value="23">23rd</option>
      <option value="24">24th</option>
      <option value="25">25th</option>
      <option value="26">26th</option>
      <option value="27">27th</option>
      <option value="28">28th</option>
      <option value="29">29th</option>
      <option value="30">30th</option>
      <option value="31">31st</option>
    </select>
  </label>

  <label>Start Date of Billing Period:
    <input type="date" id="startDate">
  </label>

  <label>Rate Change Date:
    <input type="date" id="changeDate">
  </label>

  <label>End Date of Billing Period:
    <input type="date" id="endDate">
  </label>

  <label>
    <span class="bold-underline">Original Monthly Rate:</span>
    <input type="number" id="originalRate" step="0.01" inputmode="decimal" autocomplete="off" placeholder="0.00">
  </label>

  <label>
    <span class="bold-underline">New Monthly Rate:</span>
    <input type="number" id="newRate" step="0.01" inputmode="decimal" autocomplete="off" placeholder="0.00">
  </label>

  <button onclick="calculateProrate()">Calculate</button>

  <div class="result" id="result"></div>
</div>

<script>
window.onload = function () {
  setBillingDates();

  const today = new Date();
  document.getElementById('changeDate').value = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, '0'),
    String(today.getDate()).padStart(2, '0')
  ].join('-');
};

function setBillingDates() {
  const billingDay = parseInt(document.getElementById('billingDay').value, 10);
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();

  // Clamp days 29–31 to the last valid day in shorter months.
  function draftDate(y, m) {
    const lastDay = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(billingDay, lastDay));
  }

  let startDate = draftDate(year, month);
  if (today < startDate) {
    startDate = draftDate(year, month - 1);
  }

  const nextDate = draftDate(startDate.getFullYear(), startDate.getMonth() + 1);
  const endDate = new Date(nextDate.getFullYear(), nextDate.getMonth(), nextDate.getDate() - 1);

  function localDateValue(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  document.getElementById('startDate').value = localDateValue(startDate);
  document.getElementById('endDate').value = localDateValue(endDate);
}

function calculateProrate() {
  const startDateValue = document.getElementById('startDate').value;
  const changeDateValue = document.getElementById('changeDate').value;
  const endDateValue = document.getElementById('endDate').value;

  if (!startDateValue || !changeDateValue || !endDateValue) {
    document.getElementById('result').innerHTML = "<strong>Please fill in all fields correctly.</strong>";
    return;
  }

  const startDate = new Date(startDateValue + 'T00:00:00');
  const changeDate = new Date(changeDateValue + 'T00:00:00');
  const endDate = new Date(endDateValue + 'T00:00:00');

  const originalRate = parseFloat(document.getElementById('originalRate').value) || 0;
  const newRate = parseFloat(document.getElementById('newRate').value) || 0;

  if (originalRate <= 0 || newRate <= 0) {
    document.getElementById('result').innerHTML = "<strong>Please enter both monthly rates.</strong>";
    return;
  }

  const totalDays = (endDate - startDate) / (1000 * 60 * 60 * 24) + 1;
  const daysBeforeChange = (changeDate - startDate) / (1000 * 60 * 60 * 24);
  const daysAfterChange = totalDays - daysBeforeChange;

  if (totalDays <= 0 || daysBeforeChange < 0 || daysAfterChange < 0) {
    document.getElementById('result').innerHTML = "<strong>Please check that the dates are in logical order.</strong>";
    return;
  }

  const dailyOriginal = originalRate / totalDays;
  const dailyNew = newRate / totalDays;

  const proratedOriginal = dailyOriginal * daysBeforeChange;
  const proratedNew = dailyNew * daysAfterChange;
  const totalProrated = proratedOriginal + proratedNew;
  const difference = totalProrated - originalRate;

  document.getElementById('result').innerHTML = `
    <strong>Upgrade Fee:</strong> $${difference.toFixed(2)}
  `;
}
</script>

</body>
</html>
